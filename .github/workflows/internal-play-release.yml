name: Android Internal Testing Release

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: Confirm upload to the Google Play internal testing track
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play-internal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.confirm_upload }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-internal

    steps:
      - name: Check out selected ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Prepare upload signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > android/key.properties

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run game tests
        run: flutter test test/game

      - name: Build signed Android App Bundle
        run: flutter build appbundle --release

      - name: Upload to Google Play Internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.webaby.bubble_word_game
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
