name: Android Internal Testing Release

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: Confirm upload to the Google Play internal testing track
        required: true
        type: boolean
        default: false
  push:
    branches:
      - fix/android-gradle-flutter-3.50
    tags:
      - 'internal-v*'

permissions:
  contents: read

concurrency:
  group: play-internal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'push' || inputs.confirm_upload }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-internal

    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Install Android build components
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Prepare upload signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > android/key.properties

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run game tests
        run: flutter test test/game

      - name: Install Google Play API client
        run: python -m pip install --disable-pip-version-check google-api-python-client

      - name: Check Play versionCode availability
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: io.webaby.bubble_word_game
        run: python .github/scripts/verify_play_release.py --check-unused

      - name: Build signed Android App Bundle
        run: flutter build appbundle --release

      - name: Upload to Google Play Internal testing
        if: ${{ startsWith(github.ref, 'refs/tags/internal-v') || (github.event_name == 'workflow_dispatch' && inputs.confirm_upload) }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.webaby.bubble_word_game
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

      - name: Verify Google Play Internal track
        if: ${{ startsWith(github.ref, 'refs/tags/internal-v') || (github.event_name == 'workflow_dispatch' && inputs.confirm_upload) }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: io.webaby.bubble_word_game
        run: python .github/scripts/verify_play_release.py --verify-internal

      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
